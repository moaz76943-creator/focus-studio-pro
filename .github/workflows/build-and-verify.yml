name: Verify and Build Debug APK

on:
  push:
    branches: ["main", "repair/debug-apk-ci-20261117"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Pre-Commit & 100-Language Integrity Shield
        run: python3 tools/pre_commit_shield.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SQLite FFI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Bootstrap only the missing Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          scaffold="$(mktemp -d)"
          trap 'rm -rf "$scaffold"' EXIT
          flutter create --project-name focus_studio_pro --org com.moaz --platforms=android "$scaffold/scaffold"
          mkdir -p android/gradle/wrapper
          install -m 0755 "$scaffold/scaffold/android/gradlew" android/gradlew
          install -m 0644 "$scaffold/scaffold/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          install -m 0644 "$scaffold/scaffold/android/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.7-all.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run complete Flutter test suite
        run: flutter test --reporter expanded

      - name: Build installable Debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          ls -lh "$apk"
          sha256sum "$apk" | tee debug-apk-sha256.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-studio-pro-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            debug-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
